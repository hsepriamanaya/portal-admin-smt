<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Admin Document Control</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Mengimpor font modern 'Inter' -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      body { 
        background-color: #f4f7f6; 
        padding: 40px 20px; 
        font-family: 'Inter', sans-serif; 
        color: #334155;
      }
      .container { 
        max-width: 800px; 
        background: white; 
        padding: 40px; 
        border-radius: 16px; 
        box-shadow: 0 10px 40px rgba(0,0,0,0.06); 
      }
      
      /* Header & Logo Styles */
      .header-section {
        text-align: center;
        margin-bottom: 35px;
        padding-bottom: 25px;
        border-bottom: 2px dashed #e2e8f0;
      }
      .logo-img { 
        height: 75px; 
        object-fit: contain; 
        margin-bottom: 20px;
      }
      .brand-title { 
        font-weight: 700; 
        color: #0f172a; 
        font-size: 1.6rem; 
        letter-spacing: -0.5px;
        margin-bottom: 5px;
      }
      .subtitle { 
        color: #64748b; 
        font-size: 0.85rem; 
        font-weight: 600; 
        text-transform: uppercase; 
        letter-spacing: 1px;
        margin: 0;
      }

      /* Form Section Styles */
      .form-section {
        background-color: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 25px;
        margin-bottom: 25px;
      }
      .section-title {
        font-size: 0.9rem;
        font-weight: 700;
        color: #0ea5e9;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
      }
      
      /* Input Styles */
      .form-label-custom { 
        font-size: 0.85rem; 
        font-weight: 600; 
        color: #475569; 
        margin-bottom: 8px;
      }
      .form-control, .form-select { 
        border-radius: 8px; 
        border: 1px solid #cbd5e1; 
        font-size: 0.95rem; 
        padding: 10px 15px;
        box-shadow: none;
        transition: all 0.2s;
      }
      .form-control:focus, .form-select:focus { 
        border-color: #3b82f6; 
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); 
      }
      
      /* Animations */
      #divRevisiKe, #divKetRevisi { transition: all 0.3s ease; }
      
      /* Button Styles */
      .btn-primary { 
        background-color: #2563eb; 
        border: none; 
        border-radius: 8px; 
        font-weight: 600; 
        letter-spacing: 0.5px; 
        padding: 12px;
        transition: all 0.3s ease; 
      }
      .btn-primary:hover { 
        background-color: #1d4ed8; 
        transform: translateY(-2px); 
        box-shadow: 0 6px 15px rgba(37, 99, 235, 0.25); 
      }
    </style>
  </head>
  <body>
    <div class="container">
      
      <!-- Header Section -->
      <div class="header-section">
        <img src="https://lh3.googleusercontent.com/u/0/d/1dKSdWBIHzzWDTfnquufOammtyuimcZ7A" alt="Logo SMT" class="logo-img">
        <h3 class="brand-title">Portal Admin Document Control</h3>
        <p class="subtitle">Sistem Manajemen Terintegrasi Priamanaya Group</p>
      </div>
      
      <form id="uploadForm" onsubmit="handleFormSubmit(event)">
        
        <!-- SECTION 1: Pengaturan Upload -->
        <div class="form-section">
          <div class="section-title">1. Konfigurasi Sistem</div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label-custom text-primary">Entitas Perusahaan</label>
              <select class="form-select" name="perusahaan" id="perusahaanSelect" onchange="updatePlaceholder()" required>
                <option value="" disabled selected>-- Pilih Perusahaan --</option>
                <option value="DP">PT Dizamatra Powerindo (DP)</option>
                <option value="PE">PT Priamanaya Energi (PE)</option>
                <option value="AM">PT Asta Maharanita (AM)</option>
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label-custom text-primary">Jenis Upload</label>
              <select class="form-select" name="jenisUpload" id="jenisUploadSelect" onchange="toggleRevisiFields()" required>
                <option value="" disabled selected>-- Pilih Jenis --</option>
                <option value="Baru">Dokumen Baru</option>
                <option value="Revisi">Revisi Dokumen</option>
              </select>
            </div>
          </div>
        </div>

        <!-- SECTION 2: Identitas Dokumen -->
        <div class="form-section">
          <div class="section-title">2. Identitas Dokumen</div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label-custom">Nomor Dokumen</label>
              <input type="text" class="form-control" name="noDokumen" id="inputNoDokumen" placeholder="Misal: P-DP-TL-HSE-01" onblur="validasiNomorLangsung()" required>
              <div id="nomorAlert" class="mt-1" style="font-size: 0.85rem;"></div>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label-custom">Judul Dokumen</label>
              <input type="text" class="form-control" name="judulDokumen" placeholder="Masukkan judul dokumen..." required>
            </div>
          </div>

          <div class="row">
            <div class="col-md-4 mb-3">
              <label class="form-label-custom">Kategori</label>
              <select class="form-select" name="kategori" required>
                <option value="" disabled selected>-- Pilih Kategori --</option>
                <option value="SOP">SOP</option>
                <option value="Instruksi Kerja">Instruksi Kerja</option>
                <option value="Formulir">Formulir</option>
              </select>
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label-custom">Departemen</label>
              <select class="form-select" name="departemen" required>
                <option value="" disabled selected>-- Pilih Departemen --</option>
                <option value="Warehouse & Fuel">Warehouse & Fuel</option>
                <option value="Finance & Accounting">Finance & Accounting</option>
                <option value="Civil Project">Civil Project</option>
                <option value="Legal">Legal</option>
                <option value="HRGA & Security">HRGA & Security</option>
                <option value="Technical Services">Technical Services</option>
                <option value="Produksi">Produksi</option>
                <option value="Angkutan & Stasiun">Angkutan & Stasiun</option>
                <option value="Plant Maintenance">Plant Maintenance</option>
                <option value="Health, Safety & Environment">Health, Safety & Environment</option>
                <option value="Pelabuhan & Angkutan">Pelabuhan & Angkutan</option>
                <option value="Lahan Eksternal & CSR">Lahan Eksternal & CSR</option>
              </select>
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label-custom">Referensi Standar</label>
              <select class="form-select" name="standarIso" required>
                <option value="" disabled selected>-- Pilih Standar --</option>
                <option value="ISO (Mandatory)">ISO (Mandatory)</option>
                <option value="SMKP (Mandatory)">SMKP (Mandatory)</option>
                <option value="ISO & SMKP (Integrasi)">ISO & SMKP (Integrasi)</option>
                <option value="Non-Mandatory">Non-Mandatory</option>
              </select>
            </div>
          </div>
        </div>

        <!-- SECTION 3: Status & Approval -->
        <div class="form-section">
          <div class="section-title">3. Status & Approval</div>
          <div class="row">
            <div class="col-md-4 mb-3" id="divRevisiKe">
              <label class="form-label-custom">Revisi Ke-</label>
              <input type="number" class="form-control" name="revisiKe" id="inputRevisiKe" min="0" value="0" required>
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label-custom">Tanggal Terbit</label>
              <input type="date" class="form-control" name="tglTerbit" required>
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label-custom">Status Dokumen</label>
              <select class="form-select" name="status" required>
                <option value="" disabled selected>-- Pilih Status --</option>
                <option value="Berlaku">Berlaku</option>
                <option value="Obsolete">Obsolete</option>
              </select>
            </div>
          </div>

          <div class="row">
            <div class="col-md-12 mb-3">
              <label class="form-label-custom">Approval Oleh (Sesuai Matriks)</label>
              <select class="form-select" name="approval" required>
                <option value="" disabled selected>-- Pilih Approval --</option>
                <option value="KTT">KTT</option>
                <option value="Direksi">Direksi</option>
              </select>
            </div>
          </div>

          <div class="row" id="divKetRevisi">
            <div class="col-md-12 mb-2">
              <label class="form-label-custom">Keterangan / Alasan Revisi</label>
              <textarea class="form-control" name="ketRevisi" id="inputKetRevisi" rows="2" placeholder="Tuliskan secara singkat alasan revisi dokumen..."></textarea>
            </div>
          </div>
        </div>

        <!-- SECTION 4: File Upload -->
        <div class="form-section bg-white border-primary border-opacity-25 shadow-sm">
          <label class="form-label-custom text-primary mb-2">📁 Upload File PDF (Scan TTD Basah)</label>
          <input type="file" class="form-control" name="fileDokumen" id="inputFileDokumen" accept="application/pdf" style="padding: 12px;" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-2" id="btnSubmit">Unggah & Simpan Dokumen</button>
        <div id="pesanStatus" class="mt-4 text-center fw-bold"></div>
        
      </form>
    </div>

    <script>
      // =========================================================================
      // PENTING: GANTI URL DI BAWAH INI DENGAN URL DEPLOY APPS SCRIPT ANDA (PORTAL ADMIN)
      // =========================================================================
      var API_URL = "https://script.google.com/macros/s/AKfycbylR3zjgPuWMG8jkw83idpNFF-hkf6a-CVJtpV5mSizuVy7f81Cw8pddx3yMh4VqaDHGQ/exec";

      // Fungsi UI: Memperbarui Placeholder
      function updatePlaceholder() {
        var kode = document.getElementById('perusahaanSelect').value;
        if (!kode) kode = "DP";
        document.getElementById('inputNoDokumen').placeholder = "Misal: P-" + kode + "-TL-HSE-01";
      }

      // Fungsi UI: Menampilkan/Menyembunyikan Kolom Revisi
      function toggleRevisiFields() {
        var jenis = document.getElementById('jenisUploadSelect').value;
        var divRevisiKe = document.getElementById('divRevisiKe');
        var divKetRevisi = document.getElementById('divKetRevisi');
        var inputRevisiKe = document.getElementById('inputRevisiKe');
        var inputKetRevisi = document.getElementById('inputKetRevisi');

        if (jenis === 'Baru') {
          divRevisiKe.style.display = 'none';
          divKetRevisi.style.display = 'none';
          inputRevisiKe.value = 0; 
          inputKetRevisi.value = "";
          inputKetRevisi.required = false; 
        } else if (jenis === 'Revisi') {
          divRevisiKe.style.display = 'block';
          divKetRevisi.style.display = 'block';
          if(inputRevisiKe.value == 0) inputRevisiKe.value = 1;
          inputKetRevisi.required = true; 
        }
        validasiNomorLangsung();
      }

      // -------------------------------------------------------------------------
      // FUNGSI 1: Validasi Ketersediaan Nomor (Menggantikan google.script.run)
      // -------------------------------------------------------------------------
      function validasiNomorLangsung() {
        var noDok = document.getElementById('inputNoDokumen').value;
        var jenis = document.getElementById('jenisUploadSelect').value;
        var alertText = document.getElementById('nomorAlert');
        var btn = document.getElementById('btnSubmit');

        if(!noDok || !jenis) {
          alertText.innerHTML = "";
          return;
        }

        alertText.innerHTML = '<span class="text-secondary fw-bold">⏳ Mengecek ketersediaan dokumen...</span>';
        btn.disabled = true;

        // Mengirim request validasi ke Apps Script
        fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: "cekDokumen", noDokumen: noDok })
        })
        .then(response => response.json())
        .then(data => {
          var isExist = data.exists; // Nilai true/false dari database
          if (jenis === 'Baru' && isExist) {
            alertText.innerHTML = '<span class="text-danger fw-bold">❌ Gagal: Dokumen sudah terdaftar. Gunakan opsi Revisi.</span>';
            btn.disabled = true; 
          } else if (jenis === 'Revisi' && !isExist) {
            alertText.innerHTML = '<span class="text-danger fw-bold">❌ Gagal: Dokumen belum terdaftar. Gunakan opsi Dokumen Baru.</span>';
            btn.disabled = true; 
          } else {
            alertText.innerHTML = '<span class="text-success fw-bold">✅ Nomor dokumen valid dan bisa digunakan.</span>';
            btn.disabled = false; 
          }
        })
        .catch(error => {
          alertText.innerHTML = '<span class="text-danger fw-bold">❌ Gagal terhubung ke database.</span>';
          console.error('Error:', error);
        });
      }

      // -------------------------------------------------------------------------
      // FUNGSI 2: Menangani Proses Upload Form dan Konversi File ke Base64
      // -------------------------------------------------------------------------
      function handleFormSubmit(event) {
        event.preventDefault();
        
        var form = document.getElementById('uploadForm');
        var btn = document.getElementById('btnSubmit');
        var pesan = document.getElementById('pesanStatus');
        
        btn.disabled = true;
        btn.innerHTML = "Mengekstrak dan Mengunggah... Mohon tunggu ⏳";
        pesan.innerHTML = "";
        pesan.className = "mt-4 text-center fw-bold text-primary";

        // Mengambil semua data inputan form
        var formData = new FormData(form);
        var dataObject = {};
        formData.forEach((value, key) => {
          if (key !== 'fileDokumen') {
            dataObject[key] = value;
          }
        });

        // Proses membaca file dan mengubahnya menjadi Base64
        var fileInput = document.getElementById('inputFileDokumen');
        var file = fileInput.files[0];

        if (file) {
          var reader = new FileReader();
          reader.onload = function(e) {
            // Memisahkan metadata data URL (data:application/pdf;base64,...)
            var base64String = e.target.result.split(',')[1]; 
            
            // Masukkan data file ke dalam objek payload
            dataObject.fileBase64 = base64String;
            dataObject.fileName = file.name;
            dataObject.fileMimeType = file.type;

            // Kirim ke Google Apps Script
            kirimKeServer(dataObject, form, btn, pesan);
          };
          reader.readAsDataURL(file); // Mulai membaca file
        } else {
          pesan.innerHTML = "File dokumen wajib diisi!";
          pesan.className = "mt-4 text-center fw-bold text-danger";
          btn.disabled = false;
          btn.innerHTML = "Unggah & Simpan Dokumen";
        }
      }

      // Fungsi Eksekutor untuk mengirim JSON payload ke Apps Script
      function kirimKeServer(dataObject, form, btn, pesan) {
        fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: "uploadDokumen", data: dataObject })
        })
        .then(response => response.json())
        .then(res => {
          pesan.innerHTML = res.message;
          if(res.success) {
            pesan.className = "mt-4 text-center fw-bold text-success";
            form.reset();
            updatePlaceholder(); 
            toggleRevisiFields(); 
            document.getElementById('nomorAlert').innerHTML = ""; 
          } else {
            pesan.className = "mt-4 text-center fw-bold text-danger";
          }
          btn.disabled = false;
          btn.innerHTML = "Unggah & Simpan Dokumen";
        })
        .catch(error => {
          pesan.innerHTML = "Terjadi kesalahan koneksi saat mengunggah dokumen.";
          pesan.className = "mt-4 text-center fw-bold text-danger";
          btn.disabled = false;
          btn.innerHTML = "Unggah & Simpan Dokumen";
          console.error('Error:', error);
        });
      }
    </script>
  </body>
</html>
